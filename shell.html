<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
*{box-sizing:border-box}body{margin:0;background:#e8eee6;color:#233b34;font:14px system-ui,sans-serif}header{padding:14px 18px;background:#fcfaef;border-bottom:1px solid #b3bfb2}h1{font-size:22px;margin:0 0 6px}h3{font-size:17px}button,select,input{font:inherit;color:inherit;border:1px solid #a6b6a7;border-radius:0;background:#fffdf5;padding:8px}button{cursor:pointer}button:hover{background:#dce7d7}button:focus-visible{outline:3px solid #458673}nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}main{display:grid;grid-template-columns:230px minmax(300px,1fr) 275px;gap:12px;padding:12px 12px 40px}aside{background:#faf8ef;padding:12px;min-width:0}#palette{display:grid;gap:5px;max-height:400px;overflow:auto;margin-top:10px}#palette button{text-align:left}#info{overflow-wrap:anywhere}#info button{margin:0 4px 5px 0}#info p{line-height:1.6}.residents{max-height:360px;overflow:auto}.residents label{display:flex;gap:5px;align-items:center;padding:5px 0;font-size:13px}.residents input{margin:0}.person{padding:10px 0;border-bottom:1px solid #c5cec0}.person span{margin-right:8px}.person img{width:44px;height:44px;object-fit:cover;vertical-align:middle}.person p{margin:5px 0;font-size:13px}#grid{display:block;width:100%;touch-action:manipulation;background:#edf1e8}#threePane{position:relative}#world{display:block;width:100%;height:640px;touch-action:none}#error{background:#fff0dc;padding:20px}#renderStats,#coords,#tool{padding:7px;font-size:12px}#tool{background:#d9e6d2}#search{width:100%;margin:8px 0}#results{display:grid;gap:5px;max-height:220px;overflow:auto}#stats,#status{font-size:12px;margin-top:5px}footer{position:fixed;bottom:0;background:#294239;color:#e8f0e6;text-align:center;width:100%;padding:5px;font-size:10px}#load{max-width:220px;font-size:12px}.viewer .editorOnly{display:none}.viewer main{grid-template-columns:220px minmax(300px,1fr) 275px}[hidden]{display:none!important}
@media(max-width:1000px){main,.viewer main{grid-template-columns:190px minmax(280px,1fr)}#info{grid-column:1/-1}.residents{display:grid;grid-template-columns:repeat(3,1fr)}#world{height:520px}}
@media(max-width:600px){main,.viewer main{display:flex;flex-direction:column;padding:8px 8px 40px}header{padding:10px}h1{font-size:19px}#palette{grid-template-columns:repeat(2,1fr);max-height:190px}#world{height:430px}.residents{grid-template-columns:repeat(2,1fr)}#results{max-height:140px}nav button{padding:7px}#load{max-width:180px}}
</style><body class="__MODE__" data-mode="__MODE__"><header><h1>__TITLE__</h1><div id="stats"></div><nav><button id="home">回到中心</button><button id="preview" class="editorOnly">切換3D預覽</button><button id="save">匯出都市 JSON</button><label>匯入 <input id="load" type="file" accept="application/json,.json"></label></nav><div id="status" role="status"></div></header><main><aside><div class="editorOnly"><select id="category" aria-label="模板分類"><option>土地</option><option>道路</option><option>建築</option><option>特殊建築</option></select><div id="palette"></div><nav><button id="select">選取</button><button id="rotate">放置旋轉90°</button><button id="rotateSelected">旋轉選取地塊</button><button id="undo">復原</button></nav><div id="tool">選取模式</div></div><input id="search" placeholder="搜尋建築、人物" aria-label="搜尋建築或人物"><div id="results"></div></aside><section><div id="mapPane"><nav><button id="up">↑ 北</button><button id="left">← 西</button><button id="right">東 →</button><button id="down">↓ 南</button></nav><div id="coords"></div><canvas id="grid" aria-label="16乘16地塊編輯網格"></canvas></div><div id="threePane" hidden><canvas id="world" aria-label="3D都市"></canvas><div id="error" hidden></div><div id="renderStats"></div><small>拖曳旋轉 · 右鍵／雙指平移 · 滾輪縮放 · 點地塊查看居民</small></div></section><aside id="info" aria-live="polite"></aside></main><footer>Copyright © 2026-2030 anshaer.com. All rights reserved.</footer>__BOOT__</body></html>
